<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" width="180" height="60">
  <rect width="100%" height="100%" fill="transparent"/>
  <!-- Digital India Stylized Emblem -->
  <g transform="translate(10, 10)">
    <circle cx="50" cy="50" r="46" fill="#f8991d" opacity="0.15"/>
    <!-- Orange swoop -->
    <path d="M 20 60 C 20 25, 75 15, 80 50 C 85 75, 40 85, 25 70" fill="none" stroke="#f8991d" stroke-width="8" stroke-linecap="round"/>
    <!-- Green swoop -->
    <path d="M 30 75 C 50 90, 85 80, 80 50 C 75 25, 30 35, 20 50" fill="none" stroke="#138808" stroke-width="8" stroke-linecap="round"/>
    <!-- Blue core -->
    <circle cx="50" cy="50" r="14" fill="#000080"/>
    <circle cx="50" cy="50" r="6" fill="#ffffff"/>
  </g>
  <!-- Text -->
  <text x="115" y="52" font-family="'Inter', 'Arial', sans-serif" font-weight="900" font-size="34" fill="#0f2b5c" letter-spacing="-0.5">Digital</text>
  <text x="218" y="52" font-family="'Inter', 'Arial', sans-serif" font-weight="900" font-size="34" fill="#f8991d" letter-spacing="-0.5">India</text>
  <text x="116" y="78" font-family="'Inter', 'Arial', sans-serif" font-weight="600" font-size="13" fill="#138808" letter-spacing="3.5">POWER TO EMPOWER</text>
</svg>